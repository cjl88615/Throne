name: TaliabuVPN bootstrap

on:
  push:
    branches:
      - taliabuvpn

permissions:
  contents: write

jobs:
  apply-customization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - name: Apply TaliabuVPN source customization
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'setApplicationName("TaliabuVPN")' src/main.cpp; then
            echo 'Customization already applied.'
            exit 0
          fi
          curl -fL 'https://mcp035.taliabu.kdns.fr/artifacts/public/a76ca1dfe37bf4dce2c746f45b6f9b1f/taliabuvpn-source.patch?expires=1787973602&sig=f538863998d0fb1cef049704905ba2a811b6bdff82c0fec3456c804787e82cb1' -o /tmp/taliabuvpn.patch
          echo '857534148d8a2e5152123886d639cbbd3fb2f9aebefb4aba668380379f773da6  /tmp/taliabuvpn.patch' | sha256sum -c -
          git apply --binary --check /tmp/taliabuvpn.patch
          git apply --binary /tmp/taliabuvpn.patch
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: sync upstream and customize TaliabuVPN'
          git push origin HEAD:taliabuvpn
