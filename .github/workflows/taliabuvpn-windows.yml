name: TaliabuVPN Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - taliabuvpn

permissions:
  contents: read

jobs:
  build-core:
    runs-on: ubuntu-22.04
    env:
      DEST: ${{ github.workspace }}/deployment/windows-amd64
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: core/server/go.sum
      - uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Build Windows x64 core
        shell: bash
        run: GOOS=windows GOARCH=amd64 ./script/build_go.sh
      - name: Pack core
        run: tar czf artifacts.tgz ./deployment
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: TaliabuVPN-${{ github.sha }}-core-windows-amd64
          path: artifacts.tgz
          compression-level: 0

  build-app:
    needs: build-core
    runs-on: windows-latest
    env:
      DEST: ${{ github.workspace }}/deployment/windows-amd64
      DEST_SUFFIX: windows-amd64
      ARCH: x64
    steps:
      - uses: actions/checkout@v4.3.1
      - name: Bundle web dashboard
        shell: bash
        run: |
          git clone --depth=1 --branch gh-pages https://github.com/SagerNet/sing-box-dashboard.git dashboard-src
          rm -rf dashboard-src/.git
          cp -R dashboard-src/. res/dashboard/
          test -f res/dashboard/index.html
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/download-artifact@v8.0.1
        with:
          name: TaliabuVPN-${{ github.sha }}-core-windows-amd64
          path: download-artifact
      - name: Download Qt and OpenSSL
        shell: bash
        run: |
          curl -L -o qt.7z https://github.com/throneproj/buildqt/releases/download/Qt_6.11.1/Qt_6.11.1_x64.7z
          curl -L -o openssl.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/openssl_x64.7z
          7z x qt.7z
          7z x openssl.7z
      - name: Configure and build
        shell: bash
        run: |
          export CMAKE_PREFIX_PATH=$PWD/Qt/lib/cmake
          export OPENSSL_ROOT_DIR=$PWD/openssl
          mkdir build
          cd build
          curl -fLso srslist.h https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h
          cmake -GNinja -DCMAKE_BUILD_TYPE=Release ..
          ninja
          cd ..
          ./script/deploy_windows.sh
          cp README_TaliabuVPN_CN-ID.txt deployment/windows-amd64/README_TaliabuVPN_CN-ID.txt
          test -f deployment/windows-amd64/TaliabuVPN.exe
          test -f deployment/windows-amd64/ThroneCore.exe
          test -f deployment/windows-amd64/README_TaliabuVPN_CN-ID.txt
          test ! -e deployment/windows-amd64/updater.exe
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue TaliabuVPN-windows-x64.zip
          Compress-Archive -Path deployment/windows-amd64/* -DestinationPath TaliabuVPN-windows-x64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: TaliabuVPN-windows-x64
          path: TaliabuVPN-windows-x64.zip
          compression-level: 0
