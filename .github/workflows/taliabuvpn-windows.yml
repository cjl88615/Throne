name: TaliabuVPN defaults + README bootstrap

on:
  push:
    branches:
      - taliabuvpn

permissions:
  contents: write

jobs:
  apply-customization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - name: Apply TaliabuVPN default settings and bilingual README
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://mcp035.taliabu.kdns.fr/artifacts/public/05da784d8196a1ce4fb11a97761580ab/taliabuvpn-defaults-readme.patch?expires=1788052100&sig=690620eb03b2f1796f275971e10ee96add1dadb2b43db1d4a28fdc63c9396fcf' -o /tmp/taliabuvpn.patch
          echo 'cbf5302933e48988cd99e70d0c3b391344e4120067111c75bf0db13ea6af43b7  /tmp/taliabuvpn.patch' | sha256sum -c -
          if git apply --check /tmp/taliabuvpn.patch; then
            git apply /tmp/taliabuvpn.patch
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add include/database/SettingsRepo.h README_TaliabuVPN_CN-ID.txt
            git commit -m 'feat: default remember profile and TUN mode'
            git push origin HEAD:taliabuvpn
          elif git apply --reverse --check /tmp/taliabuvpn.patch; then
            echo 'Customization is already applied.'
          else
            echo 'Patch does not apply cleanly.' >&2
            exit 1
          fi
